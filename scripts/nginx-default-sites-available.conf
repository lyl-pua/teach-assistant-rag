##
# Default server configuration
# Clean rebuilt for Ubuntu 22.04 + Teach RAG v2 (single /teach location, NO DUPLICATES)
# You can replace /etc/nginx/sites-available/default with this file.
# Backup of orig is created automatically before upload (via cp).
##

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 根目录 = 1Panel 默认站（学生管理系统 / codebrush 静态页）
    root /var/www/html;
    # 如果 1Panel 的默认网站内容其实在 /www/wwwroot/47.97.115.209 或其它目录，
    # 把上面这一行注释掉，改为：
    # root /www/wwwroot/47.97.115.209;

    index index.html index.htm index.nginx-debian.html;

    server_name _ 47.97.115.209;

    # ============================================================
    #  教学助手 RAG v2 /teach 入口（唯一一份，禁止重复）
    # ============================================================
    # ===== Teach RAG v2 Nginx locations (final, unique injection) =====
    location ^~ /teach/ {
        alias  /opt/teach/frontend/;
        index  index.html;
        try_files $uri $uri/ @teach_api;
        location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?|ttf|ico)$ {
            alias  /opt/teach/frontend$uri;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
    location ^~ /teach/api/ {
        proxy_pass         http://127.0.0.1:8777/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_connect_timeout   10s;
        proxy_buffering         off;
        proxy_cache             off;
        gzip                    off;
        chunked_transfer_encoding on;
    }
    location @teach_api {
        proxy_pass         http://127.0.0.1:8777;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout      600s;
        proxy_buffering         off;
    }
    location = /teach { return 301 /teach/; }
    # ============================================================
    #  /teach 结束
    # ============================================================

    location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
        try_files $uri $uri/ =404;
    }

    # pass PHP scripts to FastCGI server
    #
    #location ~ \.php$ {
    #    include snippets/fastcgi-php.conf;
    #
    #    # With php-fpm (or other unix sockets):
    #    fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    #    # With php-cgi (or other tcp sockets):
    #    fastcgi_pass 127.0.0.1:9000;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny all;
    #}
}

