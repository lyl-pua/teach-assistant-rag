# ============ 1Panel / Nginx：把 /teach/* 反代到 FastAPI (127.0.0.1:8777) ============
# 放置位置：1Panel → 网站 → 站点设置 → 配置文件  或  /www/server/panel/vhost/nginx/<你的域名>.conf
#          必须放在 server {} 块内
location ^~ /teach/ {
    alias  /opt/teach/frontend/;
    index  index.html;
    try_files $uri $uri/ @teach_api;

    # 静态资源长缓存（可选）
    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?|ttf|ico)$ {
        alias  /opt/teach/frontend$uri;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}

# /teach/api/*  反代到 uvicorn
location ^~ /teach/api/ {
    proxy_pass         http://127.0.0.1:8777/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # AI 流式生成需要较长超时、禁止缓冲（SSE）
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    proxy_connect_timeout   10s;
    proxy_buffering         off;
    proxy_cache             off;
    gzip                    off;
    chunked_transfer_encoding on;
}

# /teach -> /teach/ 自动补全
location = /teach { return 301 /teach/; }
